---
name: "DuckDB Substrait Dialect"

# ============================================================================
# SUPPORTED DATA TYPES
# ============================================================================
supported_types:
  - type: "BOOL"
    system_metadata:
      name: "BOOLEAN"
      supported_as_column: true

  - type: "I8"
    system_metadata:
      name: "TINYINT"
      supported_as_column: true

  - type: "I16"
    system_metadata:
      name: "SMALLINT"
      supported_as_column: true

  - type: "I32"
    system_metadata:
      name: "INTEGER"
      supported_as_column: true

  - type: "I64"
    system_metadata:
      name: "BIGINT"
      supported_as_column: true

  - type: "FP32"
    system_metadata:
      name: "FLOAT"
      supported_as_column: true

  - type: "FP64"
    system_metadata:
      name: "DOUBLE"
      supported_as_column: true

  - type: "DECIMAL"
    system_metadata:
      name: "DECIMAL"
      supported_as_column: true
    max_precision: 38
    max_scale: 38

  - type: "STRING"
    system_metadata:
      name: "VARCHAR"
      supported_as_column: true

  - type: "VARCHAR"
    system_metadata:
      name: "VARCHAR"
      supported_as_column: true

  - type: "FIXED_CHAR"
    system_metadata:
      name: "CHAR"
      supported_as_column: true

  - type: "BINARY"
    system_metadata:
      name: "BLOB"
      supported_as_column: true

  - type: "DATE"
    system_metadata:
      name: "DATE"
      supported_as_column: true

  - type: "PRECISION_TIME"
    system_metadata:
      name: "TIME"
      supported_as_column: true
    max_precision: 6

  - type: "PRECISION_TIMESTAMP"
    system_metadata:
      name: "TIMESTAMP"
      supported_as_column: true
    max_precision: 9

  - type: "PRECISION_TIMESTAMP_TZ"
    system_metadata:
      name: "TIMESTAMP_TZ"
      supported_as_column: true
    max_precision: 6

  - type: "STRUCT"
    system_metadata:
      name: "STRUCT"
      supported_as_column: true

  - type: "LIST"
    system_metadata:
      name: "LIST"
      supported_as_column: true

  - type: "MAP"
    system_metadata:
      name: "MAP"
      supported_as_column: true

  - type: "UUID"
    system_metadata:
      name: "UUID"
      supported_as_column: true

# ============================================================================
# SUPPORTED EXPRESSIONS
# ============================================================================
supported_expressions:
  - "LITERAL"
  - "SELECTION"
  - "SCALAR_FUNCTION"
  - "WINDOW_FUNCTION"
  - "CAST"
  - "IF_THEN"
  - "SWITCH"
  - expression: "SUBQUERY"
    subquery_types:
      - "SCALAR"
      - "IN_PREDICATE"

# ============================================================================
# SUPPORTED RELATIONS
# ============================================================================
supported_relations:
  - relation: "READ"
    read_types:
      - "NAMED_TABLE"
  - "FILTER"
  - "PROJECT"
  - "AGGREGATE"
  - "SORT"
  - "FETCH"
  - relation: "JOIN"
    join_types:
      - "INNER"
      - "LEFT"
      - "RIGHT"
      - "OUTER"
      - "LEFT_SEMI"
      - "RIGHT_SEMI"
      - "LEFT_ANTI"
      - "RIGHT_ANTI"
      - "LEFT_MARK"
  - "CROSS"
  - "LATERAL_JOIN"
  - relation: "SET"
    operations:
      - "UNION_ALL"
      - "UNION_DISTINCT"
      - "INTERSECTION_PRIMARY"
      - "MINUS_PRIMARY"
  - "WRITE"
  - "REFERENCE"

# ============================================================================
# DEPENDENCIES
# ============================================================================
dependencies:
  arithmetic: "extension:io.substrait:functions_arithmetic"
  arithmetic_decimal: "extension:io.substrait:functions_arithmetic_decimal"
  comparison: "extension:io.substrait:functions_comparison"
  datetime: "extension:io.substrait:functions_datetime"
  geometry: "extension:io.substrait:functions_geometry"
  string: "extension:io.substrait:functions_string"
  aggregate_generic: "extension:io.substrait:functions_aggregate_generic"
  aggregate_approx: "extension:io.substrait:functions_aggregate_approx"
  rounding: "extension:io.substrait:functions_rounding"
  rounding_decimal: "extension:io.substrait:functions_rounding_decimal"
  boolean: "extension:io.substrait:functions_boolean"
  list: "extension:io.substrait:functions_list"
  logarithmic: "extension:io.substrait:functions_logarithmic"
  set: "extension:io.substrait:functions_set"

# ============================================================================
# SCALAR FUNCTIONS
# ============================================================================
supported_scalar_functions:
  # Arithmetic Functions - Basic Operations
  - source: "arithmetic"
    name: "add"
