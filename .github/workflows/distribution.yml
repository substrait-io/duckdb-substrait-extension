#
# This workflow calls the main distribution pipeline from DuckDB to build, test and (optionally) release the extension
#
name: Stable Extension Distribution Pipeline
on:
  pull_request:
    branches:
      - main
    paths-ignore:
      - '**/README.md'
      - 'doc/**'
  push:
    branches:
      - main
    paths-ignore:
      - '**/README.md'
      - 'doc/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.head_ref || '' }}-${{ github.base_ref || '' }}-${{ github.ref != 'refs/heads/main' || github.sha }}
  cancel-in-progress: true

jobs:
  duckdb-stable-build:
    name: Build extension binaries
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@e38c2e18085bb960555ed74f1d9695de8e67b108
    with:
      duckdb_version: v2.0.0
      ci_tools_version: e38c2e18085bb960555ed74f1d9695de8e67b108
      exclude_archs: "wasm_mvp;wasm_eh;wasm_threads;windows_amd64;windows_amd64_mingw"
      extension_name: substrait
      # Intel macOS is opt-in in the 2.0 build matrix; keep shipping it.
      opt_in_archs: "osx_amd64"
      # Build and test the whole matrix on pull requests too, as before 2.0.
      reduced_ci_mode: disabled

  duckdb-stable-deploy:
    name: Deploy extension binaries
    needs: duckdb-stable-build
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_deploy.yml@e38c2e18085bb960555ed74f1d9695de8e67b108
    secrets: inherit
    with:
      duckdb_version: v2.0.0
      ci_tools_version: e38c2e18085bb960555ed74f1d9695de8e67b108
      exclude_archs: "wasm_mvp;wasm_eh;wasm_threads;windows_amd64;windows_amd64_mingw"
      extension_name: substrait
      # Intel macOS is opt-in in the 2.0 build matrix; keep shipping it.
      opt_in_archs: "osx_amd64"
      # Build and test the whole matrix on pull requests too, as before 2.0.
      reduced_ci_mode: disabled
      deploy_latest: true
